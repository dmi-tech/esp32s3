# Log + console UART0 (cổng "UART" trên DevKitC-1)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_GPIO=y
CONFIG_PWM=y

# PID dùng float ở nhiều luồng
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_MAIN_STACK_SIZE=4096

# ESP32-S3-DevKitC-1: flash 8 MB
CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y

CONFIG_REQUIRES_FULL_LIBC=y

# tables.json trên LittleFS
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

CONFIG_THREAD_NAME=y

# WiFi station
CONFIG_WIFI=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_DNS_RESOLVER=y
CONFIG_SNTP=y

# http://robot.local (bản cũ dùng hostname DHCP "robot-line" và mDNS "robot";
# Zephyr chỉ có một hostname cho cả hai)
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="robot"
CONFIG_MDNS_RESPONDER=y

CONFIG_HEAP_MEM_POOL_SIZE=65536

# HTTP + WebSocket
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_2=n
CONFIG_HTTP_SERVER_WEBSOCKET=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=1024
CONFIG_HTTP_SERVER_STACK_SIZE=6144
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=20
CONFIG_WEBSOCKET_MAX_CONTEXTS=4
CONFIG_NET_CONTEXT_SNDTIMEO=y

# Mỗi WebSocket dùng 2 fd; cộng HTTP, mDNS, DNS, SNTP
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_POLL_MAX=12
CONFIG_ZVFS_EVENTFD_MAX=4
CONFIG_NET_MAX_CONTEXTS=20
CONFIG_NET_MAX_CONN=20
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=2400
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Đồng hồ TM1637 và âm thanh I2S
CONFIG_AUXDISPLAY=y
CONFIG_I2S=y
CONFIG_DMA=y

# An toàn: watchdog, reset khi lỗi nghiêm trọng, canh tràn stack
CONFIG_WATCHDOG=y
CONFIG_REBOOT=y
CONFIG_STACK_SENTINEL=y
